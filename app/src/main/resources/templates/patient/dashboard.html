<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Patient dashboard')}"></head>
<body data-page="patient-dashboard" data-protected="true">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="main" class="container py-4">
    <h1 class="page-title h2 mb-4" id="welcome">Patient dashboard</h1>
    <div class="row g-3 mb-4">
        <div class="col-6"><div class="card stat-card"><div class="card-body text-center"><div class="stat-value" id="statUpcoming">-</div><div class="text-muted small">Upcoming appointments</div></div></div></div>
        <div class="col-6"><div class="card stat-card"><div class="card-body text-center"><div class="stat-value" id="statTotal">-</div><div class="text-muted small">All appointments</div></div></div></div>
    </div>
    <div class="row g-4">
        <div class="col-lg-5">
            <div class="card h-100"><div class="card-body">
                <h2 class="h5">Find a doctor</h2>
                <form id="quickSearch" class="mb-3">
                    <label for="qname" class="form-label">Doctor name</label>
                    <div class="input-group">
                        <input class="form-control" id="qname" name="name" placeholder="e.g. Verma">
                        <button class="btn btn-clinic" type="submit">Search</button>
                    </div>
                </form>
                <a class="btn btn-outline-primary" th:href="@{/patient/doctors}">Browse all doctors and specialties</a>
            </div></div>
        </div>
        <div class="col-lg-7">
            <div class="card h-100"><div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h2 class="h5 mb-0">Upcoming appointments</h2>
                    <a class="btn btn-sm btn-clinic" th:href="@{/patient/appointments}">View history</a>
                </div>
                <div id="upcoming"></div>
            </div></div>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/patient.js}"></script>
</body>
</html>
