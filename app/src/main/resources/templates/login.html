<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${roleLabel} + ' login')}"></head>
<body data-page="login" th:classappend="'theme-' + ${theme}">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="main" class="container login-wrap py-5">
    <div class="card login-card">
        <div class="card-body p-4">
            <span class="badge role-badge mb-3" th:text="${roleLabel}">Role</span>
            <h1 class="h3 mb-1" th:text="${roleLabel} + ' login'">Login</h1>
            <p class="text-muted" th:text="${blurb}"></p>
            <div id="formAlert" class="alert d-none" role="alert"></div>
            <form id="loginForm" novalidate th:attr="data-role=${role}">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" autocomplete="username" required>
                    <div class="invalid-feedback">Please enter a valid email address.</div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
                    <div class="invalid-feedback">Please enter your password.</div>
                </div>
                <button type="submit" class="btn btn-accent w-100">Sign in</button>
            </form>
            <p class="mt-3 mb-0 small text-center" th:if="${role == 'PATIENT'}">
                New patient? <a th:href="@{/register}">Create an account</a>
            </p>
            <p class="mt-2 mb-0 small text-center"><a th:href="@{/}">Back to start</a></p>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/auth.js}"></script>
</body>
</html>
