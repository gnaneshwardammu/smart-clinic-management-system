spring.application.name=smart-clinic-management-system
server.port=${SERVER_PORT:8082}

# ---- MySQL (secrets come from environment variables, never from this file) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/capstone?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
# update = create/alter tables to match the entities (local development).
# Use "validate" in production after running database/schema.sql.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- MongoDB (prescriptions) ----
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/clinic_prescriptions}
spring.data.mongodb.auto-index-creation=true

# ---- JWT ----
# JWT_SECRET is REQUIRED (at least 32 characters). The app refuses to start without it.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# ---- Appointment rules ----
app.appointment.duration-minutes=30

# ---- Never leak internals in error responses ----
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
