# Tests use an in-memory H2 database and a throw-away secret. Your MySQL data is never touched.
spring.datasource.url=jdbc:h2:mem:clinictest;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.data.mongodb.uri=mongodb://localhost:27017/clinic_prescriptions_test
spring.data.mongodb.auto-index-creation=false
app.jwt.secret=test-only-secret-test-only-secret-1234567890
app.jwt.expiration-minutes=60
app.appointment.duration-minutes=30
