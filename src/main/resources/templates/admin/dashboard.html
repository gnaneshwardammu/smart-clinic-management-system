<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin dashboard')}"></head>
<body data-page="admin-dashboard" data-protected="true">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="main" class="container py-4">
    <h1 class="page-title h2 mb-4">Admin dashboard</h1>
    <div class="row g-3 mb-4" id="stats"></div>
    <div class="d-flex justify-content-between align-items-center mb-2">
        <h2 class="h4 mb-0">All appointments</h2>
        <a class="btn btn-clinic btn-sm" th:href="@{/admin/doctors/new}">Add doctor</a>
    </div>
    <div id="appointments" class="mb-5"></div>
    <h2 class="h4">Registered patients</h2>
    <div id="patients"></div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
