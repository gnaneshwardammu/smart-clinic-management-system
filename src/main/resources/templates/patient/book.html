<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Book appointment')}"></head>
<body data-page="patient-book" data-protected="true">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="main" class="container py-4" style="max-width: 760px;">
    <h1 class="page-title h2 mb-3">Book an appointment</h1>
    <div class="card card-body mb-3" id="doctorInfo"></div>
    <div id="formAlert" class="alert d-none" role="alert"></div>
    <form id="bookForm" class="card card-body" novalidate>
        <div class="mb-3">
            <label for="date" class="form-label">Date (Monday-Friday)</label>
            <input type="date" class="form-control" id="date" required>
        </div>
        <div class="mb-3">
            <span class="form-label d-block">Available time slots (30 minutes each)</span>
            <div id="slots" aria-live="polite"><div class="text-muted">Choose a date to see free slots.</div></div>
        </div>
        <div class="mb-3">
            <label for="reason" class="form-label">Reason for visit (optional)</label>
            <input class="form-control" id="reason" name="reason" maxlength="255">
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-clinic">Confirm booking</button>
            <a class="btn btn-outline-secondary" th:href="@{/patient/doctors}">Back</a>
        </div>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/patient.js}"></script>
</body>
</html>
