<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Find doctors')}"></head>
<body data-page="patient-doctors" data-protected="true">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="main" class="container py-4">
    <h1 class="page-title h2 mb-3">Find a doctor</h1>
    <form id="searchForm" class="card card-body mb-3">
        <div class="row g-3 align-items-end">
            <div class="col-md-4">
                <label for="name" class="form-label">Doctor name</label>
                <input class="form-control" id="name" name="name" placeholder="e.g. Verma">
            </div>
            <div class="col-md-3">
                <label for="specialty" class="form-label">Specialty</label>
                <select class="form-select" id="specialty" name="specialty"><option value="">All specialties</option></select>
            </div>
            <div class="col-md-3">
                <label for="dateTime" class="form-label">Available at (optional)</label>
                <input type="datetime-local" class="form-control" id="dateTime" name="dateTime" step="1800">
            </div>
            <div class="col-md-2 d-flex gap-2">
                <button type="submit" class="btn btn-clinic flex-fill">Search</button>
                <button type="reset" class="btn btn-outline-secondary">Reset</button>
            </div>
        </div>
    </form>
    <p class="text-muted" id="resultCount" aria-live="polite"></p>
    <div class="row g-3" id="results"></div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/patient.js}"></script>
</body>
</html>
