<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Prescriptions')}"></head>
<body data-page="prescriptions" data-protected="true">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="main" class="container py-4">
    <h1 class="page-title h2 mb-3">Prescriptions</h1>
    <div class="card mb-4 d-none" id="rxFormCard">
        <div class="card-body">
            <h2 class="h5" id="rxFormTitle">New prescription</h2>
            <div id="formAlert" class="alert d-none" role="alert"></div>
            <form id="rxForm" novalidate>
                <div class="mb-3" style="max-width: 260px;">
                    <label for="appointmentId" class="form-label">Appointment ID *</label>
                    <input type="number" min="1" class="form-control" id="appointmentId" name="appointmentId" required>
                    <div class="invalid-feedback">Enter the appointment id (shown in your appointment list link).</div>
                </div>
                <div id="medicines"></div>
                <button type="button" class="btn btn-sm btn-outline-secondary mb-3" id="addMed">+ Add medicine</button>
                <div class="mb-3">
                    <label for="instructions" class="form-label">Instructions</label>
                    <textarea class="form-control" id="instructions" name="instructions" rows="2" maxlength="1000"></textarea>
                </div>
                <button type="submit" class="btn btn-clinic">Save prescription</button>
            </form>
        </div>
    </div>
    <div id="rxList"></div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/prescriptions.js}"></script>
</body>
</html>
